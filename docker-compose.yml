services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/pharmatrace.db
    volumes:
      - pharmatrace-data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  pharmatrace-data:
